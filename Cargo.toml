[package]
name = "meltgo"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "compiler/*",
    "crates/*",
]

[workspace.dependencies]
actoa = { path = "crates/actoa" }
lemter = { path = "crates/lemter" }
popdack = { path = "crates/popdack" }
psictre = { path = "crates/psictre" }
meltgo-errors = { path = "compiler/meltgo-errors" }
colored = "3.1.1"
regex = "1.12.4"
cranelift = "0.132.1"
cranelift-codegen = "0.132.1"
cranelift-frontend = "0.132.1"
cranelift-module = "0.132.1"
cranelift-native = "0.132.1"
cranelift-object = "0.132.1"

[dependencies]
actoa = { workspace = true }
lemter = { workspace = true }
popdack = { workspace = true }
psictre = { workspace = true }
meltgo-errors = { workspace = true }
regex = { workspace = true }

nom = "8.0.0"
target-lexicon = "0.13.5"
